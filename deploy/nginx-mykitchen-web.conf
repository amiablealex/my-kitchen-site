# My Kitchen website — nginx server block.
# Mirrors the personal-site vhost: nginx serves /static/ straight off disk and
# proxies everything else to the gunicorn service on 127.0.0.1:8008.
#
# Install: copy to /etc/nginx/sites-available/mykitchen-web, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
#
# TLS is terminated at Cloudflare (the tunnel reaches this server over http on
# port 80), so no certs are needed here.

server {
    listen 80;
    server_name your-domain.example;   # <-- set to your real domain

    location /static/ {
        alias /home/pi/projects/my-kitchen-website/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
