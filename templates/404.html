{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Not found: {{ site.name }}{% endblock %}

{% block content %}
<section class="page-head">
  <div class="wrap">
    <h1 class="display page-title">Page not found</h1>
    <p class="lead">There's no page at this address.</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="{{ url_for('index') }}">{{ icon('home') }} Home</a>
      <a class="btn btn--secondary" href="{{ url_for('docs') }}">{{ icon('menu_book') }} Docs</a>
    </div>
  </div>
</section>
{% endblock %}
